*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

.wrap{max-width:680px;margin:0 auto;padding:0 20px 96px}

  border-bottom:1px solid var(--kasumi);padding-bottom:2px;

}
.topnav a:hover{color:var(--sumi);border-bottom-color:var(--ma)}
.topnav a.here{color:var(--sumi);border-bottom-color:var(--sumi)}

h1{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.02em;margin:22px 0 2px}

.cred dl{margin:0}
.cred dt{display:inline;font-weight:400;opacity:.72}
.cred dd{display:inline;margin:0 14px 0 5px}

.out{
  display:inline-block;margin-top:14px;
  font-size:13.5px;color:var(--aozora);text-decoration:none;
  border-bottom:1px solid rgba(44,110,155,.32);padding-bottom:1px;
}
.out:hover{border-bottom-color:var(--aozora)}

.more{
  display:block;width:100%;margin-top:28px;padding:14px;

  font-family:var(--sans);font-size:13.5px;color:var(--sumi);cursor:pointer;letter-spacing:.06em;
}
.more:hover{background:#fff}

footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--kasumi);font-size:11.5px;color:var(--ma);line-height:1.95}
footer a{color:var(--aozora);text-decoration:none}

.pagenav+footer{margin-top:22px;padding-top:0;border-top:none}

const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let shown = 15;

function dayLabel(dateStr){
  const [y,m,d] = dateStr.split("-");
  return `${m}月${d}日`;
}

function entry(e){
  return `<article class="entry">
    <div class="ttl">${esc(e[1])}</div>
    <div class="by">${esc(e[2])}</div>
    <div class="cred"><dl><dt>入力</dt><dd>${esc(e[4])}</dd><dt>校正</dt><dd>${esc(e[5])}</dd></dl></div>
    <a class="out" href="${e[3]}" target="_blank" rel="noopener">青空文庫で読む</a>
  </article>`;
}

function render(){
  const view = NEWS.slice(0, shown);
  let html = "";
  let lastDay = null;
  for(const e of view){
    if(e[0] !== lastDay){
      html += `<div class="day-label">${dayLabel(e[0])}</div>`;
      lastDay = e[0];
    }
    html += entry(e);
  }
  document.getElementById("list").innerHTML = html;
  document.getElementById("more").hidden = shown >= NEWS.length;
}
document.getElementById("more").onclick = () => { shown += 15; render(); };

const s = AOZORA_STATS;

document.getElementById("stat").innerHTML =
